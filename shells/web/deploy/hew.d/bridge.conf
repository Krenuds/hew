# Remote control bridge (docs/agents/HEW_API.md §11.5) — proxies /bridge/ to a
# local hew-bridge process. Copied into /etc/nginx/hew.d/ (which nginx.conf
# includes) only when remote control is enabled; the web app is complete
# without it. Harmless if hew-bridge is down: the session request 502s and the
# Settings pane reports "not connected".
#
# READ THIS BEFORE ENABLING. hew-bridge lets a client on this server read and
# edit the document in a visitor's tab. Everything under /bridge/ must sit
# behind an authenticating front — Cloudflare Access, your SSO, mTLS, whatever
# you already run — and hew-bridge must be configured to verify that identity
# itself (HEW_BRIDGE_ACCESS_TEAM_DOMAIN / HEW_BRIDGE_ACCESS_AUD). It refuses to
# start with neither that nor the explicit --insecure-no-edge-auth opt-out.
#
# The trailing slash on proxy_pass strips the /bridge/ prefix, so hew-bridge
# sees /session and /ws — it accepts both spellings anyway.
# `location = /bridge` catches the bare, slash-less URL that would otherwise
# fall into try_files and 404 as a missing static file.

location = /bridge { return 308 /bridge/; }

location /bridge/ {
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    # The WebSocket upgrade. Without these two the /bridge/ws request arrives
    # as a plain GET and the bridge answers 400 — the whole transport is one
    # long-lived upgraded connection.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # A live session is idle whenever the user is not driving it, which is
    # most of the time. The default 60s read timeout would tear the socket
    # down every minute; the browser would reconnect, but a request in flight
    # at that moment would be lost.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Frames are small and latency-sensitive: an agent watching a box appear
    # should not wait on a proxy buffer.
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pass the edge's identity assertion through. hew-bridge verifies it
    # itself rather than trusting that it was fronted (§11.5), so stripping
    # this header does not open the bridge — it closes it.
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
}
